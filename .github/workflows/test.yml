name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # No Octave job: import_muse relies on readtable/datetime and the classifiers
  # on the Statistics and Machine Learning Toolbox, none of which Octave provides.
  matlab-smoke:
    name: MATLAB smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout EEGLAB
        uses: actions/checkout@v4
        with:
          repository: sccn/eeglab
          path: eeglab
          submodules: recursive

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >
            MATLAB
            Signal_Processing_Toolbox
            Statistics_and_Machine_Learning_Toolbox

      - name: Import all test files
        uses: matlab-actions/run-command@v2
        env:
          EEGLAB_PATH: ${{ github.workspace }}/eeglab
        with:
          command: cd(fullfile(getenv('GITHUB_WORKSPACE'), 'tests')); smoke_test
